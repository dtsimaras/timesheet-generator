name: Build release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build native bundle
        run: python -m PyInstaller --noconfirm --clean --onedir --name timesheet-generator --collect-all holidays main.py
      - name: Package release archive
        run: python scripts/package_release.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: timesheet-generator-${{ matrix.platform }}
          path: release/*.zip
  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create release and attach downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes
