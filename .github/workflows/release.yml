name: Build release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset_name: macos-arm64
          - os: macos-15-intel
            platform: macos
            asset_name: macos-intel
          - os: windows-latest
            platform: windows
            asset_name: windows-x64
          - os: ubuntu-latest
            platform: linux
            asset_name: linux-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build native bundle
        run: python -m PyInstaller --noconfirm --clean --onedir --name timesheet-generator --collect-all holidays main.py
      - name: Package release archive
        run: python scripts/package_release.py --platform ${{ matrix.platform }} --asset-name ${{ matrix.asset_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: timesheet-generator-${{ matrix.asset_name }}
          path: release/*.zip
  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update release with downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME"; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes
          fi
